<div class="table-wrap"><table class="data-table"><thead><tr><th>Engagement</th><th>Client</th><th>Owner</th><th>Contract value</th><th>Status</th><th></th></tr></thead><tbody>{% for item in engagements %}<tr><td data-label="Engagement"><a href="/Engagements/{{ item.id }}" class="entity-cell"><span class="entity-avatar"><svg><use href="/Static/Images/icons.svg#briefcase"/></svg></span><div><strong>{{ item.name }}</strong><small>{{ item.type }}</small></div></a></td><td data-label="Client">{{ item.client.display_name }}</td><td data-label="Owner">{{ item.owner.name }}</td><td data-label="Value"><strong>{{ item.contract_value|cad }}</strong></td><td data-label="Status"><span class="status-badge {{ item.status|lower|replace(' ','-') }}"><i></i>{{ item.status }}</span></td><td><a class="row-arrow" href="/Engagements/{{ item.id }}"><svg><use href="/Static/Images/icons.svg#chevron-right"/></svg></a></td></tr>{% else %}<tr><td colspan="6">{% include "Common/_Empty.html" %}</td></tr>{% endfor %}</tbody></table></div>
