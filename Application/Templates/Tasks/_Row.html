<article class="task-record"><span class="priority-rail {{ task.priority|lower }}"></span><div class="task-record-main"><strong>{{ task.title }}</strong><span>{% if not hide_task_project %}{{ task.project.name }}{% endif %}{% if task.assignee %}{% if not hide_task_project %} · {% endif %}{{ task.assignee.name }}{% endif %}</span></div><span class="priority-chip {{ task.priority|lower }}">{{ task.priority }}</span><span class="task-due {% if task.due_date and task.due_date < today and task.status != 'Done' %}overdue{% endif %}">{{ task.due_date.strftime('%b %d') if task.due_date else 'No due date' }}</span><form method="post" action="/Tasks/{{ task.id }}/Status" class="task-status-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><select name="status" onchange="this.form.requestSubmit()" aria-label="Status for {{ task.title }}">{% for value in ['To Do','In Progress','Blocked','Review','Done'] %}<option {% if task.status==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></form></article>
