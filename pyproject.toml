[project]
name = "workdesk"
version = "0.1.0"
requires-python = ">=3.14"
description = "A focused internal operations desk built with Litestar, HTMX and SQLAlchemy."
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.0",
    "jinja2>=3.1.6",
    "litestar[standard]>=2.24.0",
    "pydantic[email]>=2.11.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.16.0",
    "reportlab>=4.4.0",
]

[project.scripts]
workdesk = "Application.CLI:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["Application"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pypdf>=6.0.0",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["Tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
