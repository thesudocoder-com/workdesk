services:
  workdesk:
    build: .
    env_file: .env.production
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - workdesk-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  workdesk-data:
